name: Release Smoke

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  binary-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - run: bun run typecheck
      - if: runner.os != 'Windows'
        run: bun test tests/packaging
      - if: runner.os == 'Windows'
        run: bun test apps/cli/tests/extension-install.test.ts --test-name-pattern "compiled Bun builds|Windows"
      - if: runner.os == 'Windows'
        run: bun test tests/packaging/npm-package.test.ts
      - run: bun run package:release:test
      - run: bun run scripts/package-npm.ts --targets=host
      - uses: actions/upload-artifact@v7
        with:
          name: recallbase-release-${{ matrix.os }}
          path: .artifacts/release/**
