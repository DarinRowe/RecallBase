name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - run: bun run typecheck
      - run: bun test

  windows-native-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - run: bun run typecheck
      - run: bun test apps/cli/tests/extension-install.test.ts --test-name-pattern "compiled Bun builds|Windows"
      - run: bun test tests/packaging/npm-package.test.ts
      - run: bun run package:cli
      - name: Seed a discovered Chromium browser registry root
        shell: pwsh
        run: |
          reg add "HKCU\Software\ExampleBrowser\Browser\NativeMessagingHosts\existing_host" /ve /t REG_SZ /d "$env:RUNNER_TEMP\existing-host.json" /f
      - name: Install and verify the compiled Windows native host
        shell: pwsh
        run: |
          $testHome = Join-Path $env:RUNNER_TEMP "recallbase-native-host"
          $env:USERPROFILE = $testHome
          $env:LOCALAPPDATA = Join-Path $testHome "AppData\Local"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          $versionOutput = & .\dist\rb.exe --version 2>&1
          $versionOutput | ForEach-Object { Write-Output $_ }
          if (-not ($versionOutput -match '^recallbase ')) { throw "Compiled Windows CLI did not enter normal command mode." }
          $probeHost = Join-Path $testHome "extension-host.exe"
          Copy-Item .\dist\rb.exe $probeHost
          $env:RECALLBASE_PROBE_HOST = $probeHost
          bun -e 'const payload = new TextEncoder().encode(JSON.stringify({ type: "health", protocolVersion: 1 })); const frame = new Uint8Array(payload.length + 4); new DataView(frame.buffer).setUint32(0, payload.length, true); frame.set(payload, 4); const result = Bun.spawnSync([Bun.env.RECALLBASE_PROBE_HOST], { stdin: frame, stdout: "pipe", stderr: "pipe", timeout: 5000 }); console.log(JSON.stringify({ exitCode: result.exitCode, stdout: Array.from(result.stdout), stderr: new TextDecoder().decode(result.stderr) }));'
          & .\dist\rb.exe extension install-host --chromium-registry-root "HKCU\Software\FreshBrowser\Browser\NativeMessagingHosts" --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\rb.exe extension verify-host --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          reg query "HKCU\Software\FreshBrowser\Browser\NativeMessagingHosts\ai.recallbase.extension_host" /ve
          $freshExit = $LASTEXITCODE
          reg query "HKCU\Software\ExampleBrowser\Browser\NativeMessagingHosts\ai.recallbase.extension_host" /ve
          $exampleExit = $LASTEXITCODE
          if ($freshExit -ne 0) { exit $freshExit }
          if ($exampleExit -ne 0) { exit $exampleExit }

  linux-native-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - run: bun run typecheck
      - run: bun run package:cli
      - name: Install and verify the compiled Linux native host
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/recallbase-native-host"
          export XDG_CONFIG_HOME="$HOME/.config"
          mkdir -p "$XDG_CONFIG_HOME/ExampleBrowser/Default/Extensions"
          printf '{}\n' > "$XDG_CONFIG_HOME/ExampleBrowser/Local State"
          printf '{}\n' > "$XDG_CONFIG_HOME/ExampleBrowser/Default/Preferences"
          custom_profile="$RUNNER_TEMP/custom-linux-browser"
          mkdir -p "$custom_profile/Default"
          printf '{}\n' > "$custom_profile/Local State"
          printf '{}\n' > "$custom_profile/Default/Preferences"
          ./dist/rb extension install-host --chromium-user-data-dir "$custom_profile"
          ./dist/rb extension verify-host
          test -f "$XDG_CONFIG_HOME/chromium/NativeMessagingHosts/ai.recallbase.extension_host.json"
          test -f "$XDG_CONFIG_HOME/ExampleBrowser/NativeMessagingHosts/ai.recallbase.extension_host.json"
          test -f "$custom_profile/NativeMessagingHosts/ai.recallbase.extension_host.json"

  macos-native-host:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - run: bun run typecheck
      - run: bun run package:cli
      - name: Install and verify the compiled macOS native host
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/recallbase-native-host"
          app="$HOME/Applications/ExampleBrowser.app"
          profile="$HOME/Library/Application Support/ExampleBrowser/User Data"
          mkdir -p "$app/Contents" "$profile/Default/Extensions"
          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleName string ExampleBrowser" \
            -c "Add :CFBundleIdentifier string net.example.browser" \
            -c "Add :CFBundleURLTypes array" \
            -c "Add :CFBundleURLTypes:0 dict" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string http" \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:1 string https" \
            "$app/Contents/Info.plist"
          printf '{}\n' > "$profile/Local State"
          printf '{}\n' > "$profile/Default/Preferences"
          custom_profile="$RUNNER_TEMP/custom-macos-browser"
          mkdir -p "$custom_profile/Default"
          printf '{}\n' > "$custom_profile/Local State"
          printf '{}\n' > "$custom_profile/Default/Preferences"
          ./dist/rb extension install-host --chromium-user-data-dir "$custom_profile"
          ./dist/rb extension verify-host
          test -f "$HOME/Library/Application Support/Google/ChromeForTesting/NativeMessagingHosts/ai.recallbase.extension_host.json"
          test -f "$HOME/Library/Application Support/Chromium/NativeMessagingHosts/ai.recallbase.extension_host.json"
          test -f "$profile/NativeMessagingHosts/ai.recallbase.extension_host.json"
          test -f "$custom_profile/NativeMessagingHosts/ai.recallbase.extension_host.json"
