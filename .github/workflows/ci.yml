name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - run: bun run typecheck
      - run: bun test

  windows-native-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install
      - run: bun run typecheck
      - run: bun test apps/cli/tests/extension-install.test.ts --test-name-pattern "compiled Bun builds|Windows"
      - run: bun test tests/packaging/cli-binary-smoke.test.ts tests/packaging/npm-package.test.ts
      - run: bun run package:cli
      - name: Install and verify the compiled Windows native host
        shell: pwsh
        run: |
          $testHome = Join-Path $env:RUNNER_TEMP "recallbase-native-host"
          $env:USERPROFILE = $testHome
          $env:LOCALAPPDATA = Join-Path $testHome "AppData\Local"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          & .\dist\rb.exe extension install-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\rb.exe extension verify-host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
