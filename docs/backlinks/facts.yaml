schema: backlink-product-facts/v1
facts:
  product_name: RecallBase
  canonical_url: https://github.com/DarinRowe/RecallBase
  product_type: GitHub repository
  category: open-source local-first AI conversation history CLI and Agent Skill
  tagline: Give any AI agent instant access to your conversation history—across agents and web AI, all stored locally.
  license: MIT
  distribution: npm package, GitHub release binaries, and a repository-hosted Agent Skill
  summary: RecallBase is an open-source, local-first CLI that brings conversation history from local AI agents and supported web AI tools into one searchable local index, accessible to AI agents through a built-in MCP server.
  agent_skill_name: recallbase
  agent_skill_url: https://github.com/DarinRowe/RecallBase/tree/main/skills/recallbase
  agent_skill_install: npx skills add DarinRowe/RecallBase --global
  agent_skill_prerequisite: The rb CLI must be installed separately and available on PATH; installing the Agent Skill does not install the executable.
  agent_skill_purpose: Recover context from local AI conversation history for same-day summaries, session continuation, and source-backed decision tracing.
  agent_skill_validation: The repository includes a fixture-backed integration test for the documented sources, today, search, and open workflow; the package passes the Codex Skill validator, Claude plugin strict validation, gh skill publish dry-run, and skills CLI discovery.
  claude_plugin_path: .claude-plugin/plugin.json
  claude_plugin_layout: The repository root is a single-Skill Claude Code plugin whose manifest points to the canonical skills directory.
  gemini_extension_path: gemini-extension.json
  gemini_extension_layout: The repository root is a Gemini CLI extension whose canonical Agent Skill remains in skills/recallbase.
  agent_skill_single_file_url: https://github.com/DarinRowe/RecallBase/blob/main/distributions/recallbase.skill.md
  agent_skill_single_file_generation: The single-file distribution is deterministically generated from the canonical SKILL.md and its three references and is protected by an integration test.
prohibited_claims:
  - cloud sync
  - cloud backup
  - team collaboration
  - server-side raw conversation storage
